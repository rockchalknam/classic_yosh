<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoshi's Island - Game Dev Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: white; }
        h1 { margin-bottom: 12px; font-size: 1.2em; color: #4CAF50; }
        #game-container { width: 560px; height: 384px; border: 5px solid #4CAF50; border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); transform: scale(1.5); transform-origin: center center; margin: 80px 0 100px 0; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .controls { margin-top: 15px; text-align: center; font-size: 0.85em; opacity: 0.7; }
    </style>
</head>
<body>
    <h1>Super Mario World 2: Yoshi's Island</h1>
    <div id="game-container">
        <iframe src="https://archive.org/embed/super-mario-world-2-yoshis-island-usa-rev-a" allowfullscreen></iframe>
    </div>
    <div class="controls">
        <p><b>Controls:</b> Arrows = Move | Z = Jump | X = Tongue/Gulp | A = Throw Egg | S = Run/Flutter</p>
    </div>
</body>
</html>
