<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoshi's Island - Game Dev Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: white; }
        h1 { margin-bottom: 12px; font-size: 1.2em; color: #4CAF50; }
        #game-container { width: 800px; height: 600px; border: 5px solid #4CAF50; border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #emulator { width: 100%; height: 100%; }
        .controls { margin-top: 15px; text-align: center; font-size: 0.85em; opacity: 0.7; }
    </style>
</head>
<body>
    <h1>Super Mario World 2: Yoshi's Island</h1>
    <div id="game-container">
        <div id="emulator"></div>
    </div>
    <div class="controls">
        <p><b>Controls:</b> Arrows = Move | Z = Jump | X = Tongue/Gulp | A = Throw Egg | S = Run/Flutter</p>
    </div>
    <script>
        EJS_player = '#emulator';
        EJS_core = 'snes';
        EJS_gameName = "Yoshi's Island";
        EJS_color = '#4CAF50';
        EJS_startOnLoaded = true;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
        EJS_gameUrl = 'https://rockchalknam.github.io/classic_yosh/yoshis_island.sfc';
    </script>
    <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>
</body>
</html>
